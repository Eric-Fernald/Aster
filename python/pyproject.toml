[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-engine"
version = "0.1.0"
description = "Python client for the Aster GPU native analytical engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
duckdb = ["duckdb>=1.0", "duckdb-extension-substrait; platform_system == 'Linux'"]
arrow = ["pyarrow>=15"]
torch = ["torch>=2.2"]
jax = ["jax>=0.4"]
all = ["duckdb>=1.0", "pyarrow>=15", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aster*"]
